packages:
  - apps/*
  - packages/*
  - infra

# Keep pnpm settings here, not in package.json#pnpm. pnpm 11 ignores the
# package.json location, so Corepack/global pnpm must see the same overrides.
overrides:
  # Keep the V4 contract on one copy so Alfred can pass model handles between ai,
  # ai-retry, and provider adapters. ai 7.0.165, gateway, anthropic, openai and google
  # all sit on @ai-sdk/provider-utils@5.0.76, which pins @ai-sdk/provider 4.0.37.
  # Bump them together: a second provider-utils copy splits the `ToolSet` type.
  "@ai-sdk/provider": 4.0.37
  "@types/pg": ^8.23.1
  exact-mirror: 1.0.0

# These packages' postinstall scripts were already ignored by pnpm 10 in this
# repo. pnpm 11 makes build-script approval explicit, so keep denying the same
# scripts rather than prompting during frozen installs.
allowBuilds:
  # Needs its postinstall to fetch the platform binary; the server build calls
  # it (scripts/sentry-release.mjs) to upload source maps + associate commits.
  "@sentry/cli": true
  core-js: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  # #1865: the MCP schema validator runs server-written regex on RE2. Its install
  # step fetches the prebuilt native binary (or builds it when none matches).
  re2: true

catalog:
  # Alchemy and its Railway provider pin together with `effect` (ADR-0128 D4):
  # the Railway docs' `effect@rc` is stale and breaks the CLI boot; this triple
  # is the probe-proven set (deploy round-trip, 2026-11-18). Bump the three
  # deliberately, together, and re-run `alchemy plan` against the real project.
  "@alchemy.run/railway": 2.0.0-beta.87
  "@ai-sdk/anthropic": ^4.0.99
  "@ai-sdk/google": ^4.0.114
  "@ai-sdk/openai": ^4.0.111
  "@ai-sdk/provider": ^4.0.37
  # Elysia + its sibling packages are pinned to exact versions, and
  # exact-mirror is pinned via the workspace `overrides` block above.
  # The workspace ships a `normalize: 'typebox'` workaround on every Elysia
  # instance (apps/server/src/index.ts and packages/http/src) for an
  # option-name mismatch between
  # elysia@1.4.29 and exact-mirror@1.0.0 (elysia passes `TypeCompiler`,
  # exact-mirror reads `Compile`). Floating these on `^` risks a patch
  # bump that changes the schema-validator wiring and silently breaks
  # the workaround. Bump deliberately, all together.
  "@elysiajs/cors": 1.4.2
  "@elysiajs/eden": 1.4.9
  "@elysiajs/node": 1.4.5
  # Effect platform layers for the ADR-0128 infra program. They are peer
  # dependencies of `alchemy` (see the triple note at the top of this catalog)
  # and carry no direct import in our code, so they are declared to pin their
  # resolution next to `effect`.
  "@effect/platform-bun": ^4.1.4
  "@effect/platform-node": ^4.1.4
  # Exact pin, and catalogued so the pin has ONE home. `@alfred/extraction`
  # tells an encrypted PDF from a corrupt one by a substring of the vendor's
  # error message, and its fixtures assert that against this exact build; the
  # same native binary must also be a direct dependency of `apps/server` to
  # survive the tsdown bundle. Two manifests, one resolution.
  "@firecrawl/pdf-inspector": 1.15.0
  "@sentry/node": ^10.74.0
  "@sentry/react": ^10.74.0
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-query": ^5.102.8
  "@tanstack/react-router": ^1.170.35
  "@tanstack/router-plugin": ^1.168.37
  "@types/node": ^26.6.6
  "@vitejs/plugin-react": ^4.7.0
  # Pinned exact and bumped deliberately. This pin is a FREE choice again: the
  # ADR-0087 amendment of 2026-08-26 depends on `run` directly instead of
  # `@ai-sdk/code-mode`, and `run` declares no peer dependencies, so no other
  # entry constrains this one. (Until then, code-mode's exact `ai` peer moved in
  # lockstep and chose this line for us.) Bump to the newest version that clears
  # pnpm's 24-hour release-age floor, never past it.
  ai: 7.0.165
  # Pinned exact — ADR-0087/ADR-0124. The Code Mode sandbox substrate:
  # QuickJS-in-WebAssembly in a worker thread, zero runtime and peer runtime
  # deps. The `typescript` peer it declares from 2.1.x is OPTIONAL and only
  # type-strips guest source when Node's own `stripTypeScriptTypes` is missing
  # (Node < 22.6) — on Node 26 it is never loaded, so the `<7` range never
  # binds. Re-review the source on every bump (the version pinning rule in
  # docs/plans/code-mode-object-handles-v1.md).
  run: 2.1.13
  # Provider-fallback cascade for the LanguageModel dispatchers (see
  # `withFallback` in packages/ai/src/provider.ts). Same version warden
  # runs on the identical ai@7 / @ai-sdk/provider@4 resolution.
  ai-retry: ^2.4.0
  # The ADR-0128 infra program. Pinned with @alchemy.run/railway and effect —
  # see the triple note at the top of this catalog.
  alchemy: 2.0.0-beta.87
  # Floor is 1.6.11, not the older ^1.3.28, because every release below it
  # carries CVE-2026-53516: the OAuth callback auto-linked an account when the
  # *provider* asserted `email_verified: true` without checking the *local*
  # account's `emailVerified`. Never lower this bound. See #455.
  # #1881: 1.7.7 fixes GHSA-965c-763c-88jm and GHSA-r4xp-prcw-77qf.
  better-auth: ^1.7.27
  bullmq: ^5.81.5
  clsx: ^2.1.1
  dotenv: ^17.4.2
  # Bumped 2026-11-18 from 4.0.6 with owner approval ("we can upgrade the
  # deps"): the ADR-0128 infra program's alchemy@2.0.0-beta.87 peers on
  # effect@^4.1.4, and the ADR-0114 island (mcp/manager.ts) compiles and tests
  # green on the bump. `alchemy` + `@alchemy.run/railway` + `effect` move as
  # one pin — see the triple note at the top of this catalog.
  effect: 4.1.4
  # 1.4.29, not newer (#1881, GHSA-9643-4qgh-g8mx): it keeps the same exact-mirror range, so
  # the override and the `normalize: 'typebox'` workaround hold. 1.4.32 peers on exact-mirror
  # 0.2.x and needs that workaround re-checked before a bump.
  elysia: 1.4.29 # exact pin — see @elysiajs/* note above
  ioredis: ^5.11.1
  lucide-react: ^1.45.0
  posthog-js: ^1.430.2
  react: ^19.3.0
  # #1865: the MCP schema validator's linear-time regex engine. A native binary, so
  # `apps/server` lists it beside `@alfred/assistant` and keeps it external in tsdown.
  re2: ^1.27.2
  react-dom: ^19.3.0
  # Pinned exact (not ^) — ADR-0061: Replicache is in upstream maintenance mode
  # and we deliberately freeze the version. A caret would silently accept a
  # future 15.x; the whole point of the ADR is that the pin stands.
  replicache: 15.3.0
  resend: ^6.28.0
  sonner: ^2.0.8
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tsdown: ^0.15.12
  typescript: ^7.0.2
  # Same major as the undici that Node bundles (Node 26 ships 8.x). Global
  # `fetch` accepts a `dispatcher` from this package only while the majors match.
  undici: ^8.12.2
  vaul: ^1.1.2
  vite: ^6.4.3
  zod: 4.6.7

# The AI SDK publishes several releases a day, so a deliberate bump of the `ai`
# catalog pin is almost always younger than pnpm's release-age floor. Each entry
# below is a version this workspace chose on purpose. Add the new version and
# drop the version it replaced; never widen an entry to a range.
minimumReleaseAgeExclude:
  - "@ai-sdk/anthropic@4.0.99"
  - "@ai-sdk/gateway@4.0.138"
  - "@ai-sdk/google@4.0.114"
  - "@ai-sdk/openai@4.0.111"
  - "@ai-sdk/provider-utils@5.0.76"
  - "@ai-sdk/provider@4.0.37"
  - ai@7.0.165

patchedDependencies:
  "@alchemy.run/railway": patches/@alchemy.run__railway.patch
  "@distilled.cloud/railway@1.0.0-rc.20": patches/@distilled.cloud__railway@1.0.0-rc.20.patch

# `pnpm audit --prod --audit-level high` runs in CI (#1881). Each entry is one high or
# critical advisory that no Alfred code path reaches, with the reason. Remove an entry when
# its package is upgraded, or when a code change makes the path reachable. An id here hides
# the advisory for EVERY package that carries it, so the reason names the reachable copies
# that were upgraded instead.
auditConfig:
  ignoreGhsas:
    # files-sdk (packages/assistant/src/chat/attachments/storage.ts) imports only `files-sdk`
    # and `files-sdk/s3`. Neither entry imports fastify, express or @modelcontextprotocol/sdk;
    # those are optional peers for its server adapters and its MCP server, which Alfred never
    # starts. So no request reaches the advisories below.
    - GHSA-22jm-h49p-29qw # @modelcontextprotocol/sdk via files-sdk: server tasks
    - GHSA-46jr-4wx8-v453 # @modelcontextprotocol/sdk via files-sdk: server request size
    - GHSA-f897-62hf-6gxq # @modelcontextprotocol/sdk via files-sdk: server transports
    # Also filed against @modelcontextprotocol/client, the copy Alfred runs. That copy is
    # 2.4.0, which is fixed (>=2.2.0); only the unused files-sdk copy is left.
    - GHSA-6qxp-vccf-f47h # @modelcontextprotocol/sdk via files-sdk: OAuth client
    - GHSA-jqcg-44mw-7w3h # proxy-addr (critical) via files-sdk > sdk > express: trust proxy
    - GHSA-27r3-jxmh-p828 # body-parser via files-sdk > sdk > express
    - GHSA-667r-xxjv-c9mm # fastify via files-sdk: body replacement
    - GHSA-9q9j-q6p8-xq58 # fastify via files-sdk: header validation
    - GHSA-hwr6-493r-vm6h # fastify via files-sdk: boolean validation
    - GHSA-p68q-wchp-6fh7 # fastify via files-sdk: malformed URLs
    # fast-uri 4.x only under files-sdk > fastify. The 3.x copy under ajv, which the MCP
    # schema validator runs, resolves to a fixed release (>=3.1.7).
    - GHSA-58mr-gqgx-xq4g # fast-uri via files-sdk > fastify: unclosed bracket
    - GHSA-qw65-cvwx-89v3 # fast-uri via files-sdk > fastify: unvalidated port
    # better-auth declares vitest as an optional peer for its `test-utils` entry only.
    # packages/auth never imports that entry, so vite and postcss never load in production.
    - GHSA-587h-7wmj-h5pm # vite via better-auth > vitest: dev-server launch-editor
    - GHSA-68fv-2mgg-jv7q # source-map-js via better-auth > vitest > vite > postcss
    # packages/db `createId` calls `customAlphabet` with a constant alphabet and a constant
    # length (default 12; no caller passes another). The advisories need a zero, negative or
    # overflowing size from outside.
    - GHSA-28wg-ghj8-5hjv # nanoid: negative size
    - GHSA-2v37-7h3g-55p8 # nanoid: zero size
    - GHSA-xwg4-73v4-xw9w # nanoid: integer overflow
    # The ReDoS is in the Markdown spec helpers (`create*MarkdownSpec`). apps/web installs no
    # Markdown extension and calls none of them, and it runs in the owner's browser only.
    - GHSA-j95f-988m-3j2f # @tiptap/core: Markdown attribute parsing
