packages:
  - apps/*
  - packages/*

# Keep pnpm settings here, not in package.json#pnpm. pnpm 11 ignores the
# package.json location, so Corepack/global pnpm must see the same overrides.
overrides:
  "@types/pg": ^8.23.1
  exact-mirror: 1.0.0

# These packages' postinstall scripts were already ignored by pnpm 10 in this
# repo. pnpm 11 makes build-script approval explicit, so keep denying the same
# scripts rather than prompting during frozen installs.
allowBuilds:
  # Needs its postinstall to fetch the platform binary; the server build calls
  # it (scripts/sentry-release.mjs) to upload source maps + associate commits.
  "@sentry/cli": true
  core-js: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false

catalog:
  "@ai-sdk/anthropic": ^4.0.53
  "@ai-sdk/google": ^4.0.69
  "@ai-sdk/openai": ^4.0.66
  "@ai-sdk/provider": ^4.0.14
  # Elysia + its sibling packages are pinned to exact versions, and
  # exact-mirror is pinned via the workspace `overrides` block above.
  # The workspace ships a `normalize: 'typebox'` workaround on every Elysia
  # instance (apps/server/src/index.ts and packages/http/src) for an
  # option-name mismatch between
  # elysia@1.4.28 and exact-mirror@1.0.0 (elysia passes `TypeCompiler`,
  # exact-mirror reads `Compile`). Floating these on `^` risks a patch
  # bump that changes the schema-validator wiring and silently breaks
  # the workaround. Bump deliberately, all together.
  "@elysiajs/cors": 1.4.2
  "@elysiajs/eden": 1.4.9
  "@elysiajs/node": 1.4.5
  # Exact pin, and catalogued so the pin has ONE home. `@alfred/extraction`
  # tells an encrypted PDF from a corrupt one by a substring of the vendor's
  # error message, and its fixtures assert that against this exact build; the
  # same native binary must also be a direct dependency of `apps/server` to
  # survive the tsdown bundle. Two manifests, one resolution.
  "@firecrawl/pdf-inspector": 1.15.0
  "@sentry/node": ^10.74.0
  "@sentry/react": ^10.74.0
  "@tailwindcss/postcss": ^4.3.3
  "@tanstack/react-form": ^1.33.5
  "@tanstack/react-query": ^5.102.8
  "@tanstack/react-router": ^1.170.35
  "@tanstack/router-plugin": ^1.168.37
  "@types/node": ^24.13.4
  "@vitejs/plugin-react": ^4.7.0
  # Pinned exact and bumped deliberately. This pin is a FREE choice again: the
  # ADR-0087 amendment of 2026-08-26 depends on `run` directly instead of
  # `@ai-sdk/code-mode`, and `run` declares no peer dependencies, so no other
  # entry constrains this one. (Until then, code-mode's exact `ai` peer moved in
  # lockstep and chose this line for us.) Bump to the newest version that clears
  # pnpm's 24-hour release-age floor, never past it.
  ai: 7.0.99
  # Provider-fallback cascade for the LanguageModel dispatchers (see
  # `withFallback` in packages/ai/src/provider.ts). Same version warden
  # runs on the identical ai@7 / @ai-sdk/provider@4 resolution.
  ai-retry: ^2.4.0
  # Floor is 1.6.11, not the older ^1.3.28, because every release below it
  # carries CVE-2026-53516: the OAuth callback auto-linked an account when the
  # *provider* asserted `email_verified: true` without checking the *local*
  # account's `emailVerified`. Never lower this bound. See #455.
  better-auth: ^1.7.4
  bullmq: ^5.81.5
  clsx: ^2.1.1
  dotenv: ^17.4.2
  elysia: 1.4.28 # exact pin — see @elysiajs/* note above
  ioredis: ^5.11.1
  lucide-react: ^1.45.0
  posthog-js: ^1.430.2
  react: ^19.3.0
  react-dom: ^19.3.0
  # Pinned exact (not ^) — ADR-0061: Replicache is in upstream maintenance mode
  # and we deliberately freeze the version. A caret would silently accept a
  # future 15.x; the whole point of the ADR is that the pin stands.
  replicache: 15.3.0
  resend: ^6.28.0
  sonner: ^2.0.8
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tsdown: ^0.15.12
  typescript: ^7.0.2
  vaul: ^1.1.2
  vite: ^6.4.3
  zod: 4.6.5

# The AI SDK publishes several releases a day, so a deliberate bump of the `ai`
# catalog pin is almost always younger than pnpm's release-age floor. Each entry
# below is a version this workspace chose on purpose. Add the new version and
# drop the version it replaced; never widen an entry to a range.
minimumReleaseAgeExclude:
  - "@ai-sdk/anthropic@4.0.53"
  - "@ai-sdk/gateway@4.0.80"
  - "@ai-sdk/google@4.0.69"
  - "@ai-sdk/openai@4.0.66"
  - "@ai-sdk/provider-utils@5.0.40"
  - "@ai-sdk/provider@4.0.14"
  - ai@7.0.99
  - zod@4.6.5
