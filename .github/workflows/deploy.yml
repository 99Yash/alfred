# The production deploy (ADR-0128). The Railway services take an uploaded
# build context, not a GitHub source, so `alchemy deploy` is the only
# redeploy path: one run per push to main.
#
# Runners hold no local state, so the job runs the `adopt` script
# (`alchemy deploy --stage live --adopt --yes`): the apply-time ownership
# probe finds the existing services by id and updates them in place, never
# duplicating. The databases are lookup references — read-only, never
# created — and the `VerifyDatabases` action fails the deploy loud if one is
# missing.
#
# Auth: the CLI reads environment credentials whenever the provider's
# declared contract is fully present (RAILWAY_API_TOKEN), so no profile
# setup is needed. The token is a workspace token; a project token cannot
# reach workspace-wide operations.
#
# The commit attribution is `GITHUB_SHA` (set on push events), which the
# program writes into the server environment as `ALFRED_DEPLOYED_COMMIT_SHA`
# for the Sentry release chain and the memory producer (ADR-0128 D2).
name: deploy-production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      # The infra program needs only its own deps; the filtered install skips
      # the app workspace's dev tooling.
      - name: Install infra dependencies
        run: corepack pnpm install --frozen-lockfile --filter @alfred/infra...

      - name: Deploy (adopt in place — runner state is always empty)
        run: corepack pnpm --filter @alfred/infra adopt
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      # The web's headers live in `docker/web.Caddyfile` (#295). A Caddyfile the
      # image does not copy ships no headers and no gate notices, so read them
      # back from the live origin. `alchemy deploy` returns after the web
      # deployment reaches SUCCESS; the retry covers the edge switch-over.
      - name: Verify web security headers
        run: |
          check() {
            local url="$1"; shift
            local headers missing=""
            headers="$(curl -fsSI --max-time 15 "$url")" || return 1
            for pattern in "$@"; do
              grep -qiE "^${pattern}" <<<"$headers" || missing="$missing ${pattern%%:*}"
            done
            if [ -n "$missing" ]; then
              echo "$url is missing:$missing"
              return 1
            fi
          }
          for _ in 1 2 3 4 5 6; do
            if check https://alfred.beauty/ \
                "content-security-policy:.*frame-ancestors 'none'" "strict-transport-security:" \
                "x-frame-options:" "x-content-type-options: *nosniff" \
              && check https://alfred.beauty/c/header-check "x-robots-tag:.*noindex"; then
              echo "Web security headers present."
              exit 0
            fi
            sleep 20
          done
          echo "::error::alfred.beauty does not serve the headers in docker/web.Caddyfile"
          exit 1
