name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify architecture, boundaries, style, and types
        run: corepack pnpm verify:fast

  # ONE api job, not two. `api-unit-tests` and `api-db-tests` used to run the
  # identical command (`--filter @alfred/api test`) and differed only in whether
  # a Postgres service and `DATABASE_URL` were present. That ran all 201 test
  # files twice and gave every timing-sensitive test two chances to flake per CI.
  # The DB-backed files self-skip on `DATABASE_URL`, so the DB-less half proved
  # only that those skip guards work — and a glob split instead of a merge would
  # rot silently, because a new DB-backed file omitted from the list would skip
  # in one job and never run in the other.
  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: alfred_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d alfred_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/alfred_ci
      # Format-valid dummies required by serverEnv(). The suite uses the local
      # Postgres/Redis services and does not call external providers.
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-32chars-min
      # #453: serverEnv() requires a credential KEK decoding to 32 bytes. This
      # one seals nothing real — CI writes no provider tokens.
      OAUTH_CREDENTIAL_KEK: Y2ktZHVtbXkta2VrLTMyLWJ5dGVzLW5vdC1zZWNyZXQ
      BETTER_AUTH_URL: http://localhost:3001
      ALFRED_ALLOWED_EMAIL: ci@example.com
      RESEND_API_KEY: re_ci_dummy
      RESEND_FROM_EMAIL: Alfred <noreply@example.com>
      ANTHROPIC_API_KEY: ci-dummy
      GOOGLE_GENERATIVE_AI_API_KEY: ci-dummy
      GOOGLE_OAUTH_CLIENT_ID: ci-dummy
      GOOGLE_OAUTH_CLIENT_SECRET: ci-dummy
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:3001/api/integrations/google/callback
      GITHUB_APP_ID: "1"
      GITHUB_APP_SLUG: ci-dummy
      GITHUB_APP_CLIENT_ID: ci-dummy
      GITHUB_APP_CLIENT_SECRET: ci-dummy
      GITHUB_APP_PRIVATE_KEY: ci-dummy
      GITHUB_WEBHOOK_SECRET: ci-dummy
      GITHUB_APP_REDIRECT_URI: http://localhost:3001/api/integrations/github/callback
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: corepack pnpm --filter @alfred/db db:migrate

      - name: API tests
        run: corepack pnpm --filter @alfred/api test

  # No `services:` and no `env:` here, unlike `api-tests`. The `@alfred/http`
  # barrel is a single module-evaluation unit that loads with DATABASE_URL,
  # REDIS_URL, BETTER_AUTH_SECRET and OAUTH_CREDENTIAL_KEK all unset — measured
  # at campaign items 03, 04 and 05, and the suites under `packages/http/test`
  # touch no database. That expires the moment any module reachable from the
  # barrel reads env or calls `db()` at module scope: the symptom is this job
  # failing with an env error on a pull request that changed no test. The fix
  # is then to copy the `services:` and `env:` blocks from `api-tests` above.
  http-tests:
    name: http-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: HTTP tests
        run: corepack pnpm --filter @alfred/http test

  ai-unit-tests:
    name: ai-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: AI unit tests
        run: corepack pnpm --filter @alfred/ai test

  logging-unit-tests:
    name: logging-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Logging unit tests
        run: corepack pnpm --filter @alfred/logging test

  # @alfred/assistant holds product modules moved out of @alfred/api during
  # Phase 6B. Some are DB-backed (e.g. `delivery` owns notification idempotency
  # over `email_sends`), so this job runs Postgres + Redis + a format-valid
  # serverEnv, exactly like `api-tests`. The check name stays `assistant-unit-tests`
  # (branch-protection stability); the `test` glob runs both pure and DB-backed
  # suites, picking up the DB from the job-level env just as `api-tests` does.
  assistant-unit-tests:
    name: assistant-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: alfred_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d alfred_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/alfred_ci
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-32chars-min
      OAUTH_CREDENTIAL_KEK: Y2ktZHVtbXkta2VrLTMyLWJ5dGVzLW5vdC1zZWNyZXQ
      BETTER_AUTH_URL: http://localhost:3001
      ALFRED_ALLOWED_EMAIL: ci@example.com
      RESEND_API_KEY: re_ci_dummy
      RESEND_FROM_EMAIL: Alfred <noreply@example.com>
      ANTHROPIC_API_KEY: ci-dummy
      GOOGLE_GENERATIVE_AI_API_KEY: ci-dummy
      GOOGLE_OAUTH_CLIENT_ID: ci-dummy
      GOOGLE_OAUTH_CLIENT_SECRET: ci-dummy
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:3001/api/integrations/google/callback
      GITHUB_APP_ID: "1"
      GITHUB_APP_SLUG: ci-dummy
      GITHUB_APP_CLIENT_ID: ci-dummy
      GITHUB_APP_CLIENT_SECRET: ci-dummy
      GITHUB_APP_PRIVATE_KEY: ci-dummy
      GITHUB_WEBHOOK_SECRET: ci-dummy
      GITHUB_APP_REDIRECT_URI: http://localhost:3001/api/integrations/github/callback
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: corepack pnpm --filter @alfred/db db:migrate

      - name: Assistant tests
        run: corepack pnpm --filter @alfred/assistant test

  # This job runs the browser bundle as well as the web unit tests. The name is
  # unchanged and this comment carries the widened remit instead, because a
  # second job would pay a second full `pnpm install` for the same signal. Until
  # the build step below, no job in this workflow invoked vite, so a change that
  # type-checked and passed every unit test could still break `vite build`, and
  # the first place that showed up was a deploy. The build also rewrites the
  # tracked `apps/web/src/routeTree.gen.ts` and the route sources under
  # `apps/web/src/routes/`, which is why the assertion after it is worth its
  # lines: those files have exactly one writer, the router plugin, and
  # `@tanstack/router-plugin` is a floating caret (`^1.121.7` in
  # `pnpm-workspace.yaml`), so a plugin bump can change what it emits. `vite
  # build` needs no `env:` and no `services:` — `apps/web` has no `.env*` file.
  web-unit-tests:
    name: web-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # The router plugin swallows a generator failure into `console.error` and
      # lets the build exit 0, and it throws before it writes the tree. A build
      # whose generator never ran therefore leaves the committed file
      # byte-unchanged, which is indistinguishable from agreement. Deleting the
      # file first turns that case into a deleted tracked path, which the
      # assertion below reports.
      - name: Delete the generated route tree so the build must re-emit it
        run: rm apps/web/src/routeTree.gen.ts

      - name: Web build
        run: corepack pnpm --filter web build

      - name: Committed sources match the route generator
        run: |
          if ! git diff --exit-code; then
            echo "::error::The web build changed tracked files, so what is committed is not what @tanstack/router-plugin emits. The generator writes apps/web/src/routeTree.gen.ts and the route source files under apps/web/src/routes/. Run 'pnpm --filter web build' and commit every file it changes, verbatim. A DELETED apps/web/src/routeTree.gen.ts above means the generator itself failed - read the build step log for the error it printed."
            exit 1
          fi

      - name: Web unit tests
        run: corepack pnpm --filter web test
