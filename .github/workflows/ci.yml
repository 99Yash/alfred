name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Verify architecture, boundaries, style, and types
        run: corepack pnpm verify:fast

      - name: Build and smoke-test the PDF extraction child
        run: |
          corepack pnpm --filter server build
          test -f apps/server/dist/extract-pdf-child.js
          reply=$(printf '%s\nx' '{"limits":{"maxBytes":100,"maxCharacters":1000,"maxParseMilliseconds":5000},"byteLength":1}' | node apps/server/dist/extract-pdf-child.js)
          REPLY="$reply" node -e 'const reply = JSON.parse(process.env.REPLY); if (reply.kind !== "result" || reply.result.kind !== "invalid") process.exit(1)'

  # TWO http jobs, and they prove different claims. `http-tests` runs the whole
  # `packages/http/test` glob against real Postgres and Redis, because a file in
  # that tree may guard itself with a `{ skip: … }` option and a skipped test
  # exits 0.
  #
  # DO NOT guard this job by reading the skip count. `node:test` prints
  # `# skipped 0` for a SUITE-level skip — `describe("…", { skip: SKIP }, …)` —
  # because the subtests inside a skipped `describe` are never registered, so
  # they land in neither `# tests` nor `# skipped`. All five DB-backed suites
  # in this tree use that shape, so a run that reached no database is
  # indistinguishable by any count from a run that reached Postgres.
  #
  # What guards it instead: those suites call `dbBackedSkip()` from
  # `packages/http/test/support/db-backed.ts`. It skips on a developer machine
  # that has no Postgres, and THROWS when `CI` is set and a required variable is
  # absent. The throw fires at module scope, `node:test` reports the file as a
  # failing test, and this job exits non-zero. So if you delete or shrink the
  # `services:` or `env:` blocks below, the `HTTP tests` step reddens and names
  # the absent variable. A NEW DB-backed suite here must call `dbBackedSkip()`
  # too — the helper is a convention, not a structural check.
  #
  # `http-env-free-load` runs one file, with no `services:` and no `env:` at all.
  # The `@alfred/http` barrel is a single module-evaluation unit that must load
  # with no service variable set — measured at campaign items 03, 04 and 05 — and
  # `barrel-load.test.ts` is the detector. It is not redundant with that file's
  # own `delete process.env[…]` loop: the loop clears seven keys, so a module
  # reading BETTER_AUTH_URL or a GITHUB_* key at module scope still loads inside
  # a job whose `env:` block sets them. An empty **ambient** environment is the
  # stronger control, and it cannot be weakened by the `env:` block above growing
  # a key. The `delete` loop stays because it is what keeps the file honest in a
  # populated developer shell and inside `http-tests`.
  http-tests:
    name: http-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: alfred_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d alfred_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/alfred_ci
      # Format-valid dummies required by serverEnv(). The suite uses the local
      # Postgres/Redis services and does not call external providers.
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-32chars-min
      # #453: serverEnv() requires a credential KEK decoding to 32 bytes. This
      # one seals nothing real — CI writes no provider tokens.
      OAUTH_CREDENTIAL_KEK: Y2ktZHVtbXkta2VrLTMyLWJ5dGVzLW5vdC1zZWNyZXQ
      BETTER_AUTH_URL: http://localhost:3001
      ALFRED_ALLOWED_EMAIL: ci@example.com
      RESEND_API_KEY: re_ci_dummy
      RESEND_FROM_EMAIL: Alfred <noreply@example.com>
      ANTHROPIC_API_KEY: ci-dummy
      GOOGLE_GENERATIVE_AI_API_KEY: ci-dummy
      GOOGLE_OAUTH_CLIENT_ID: ci-dummy
      GOOGLE_OAUTH_CLIENT_SECRET: ci-dummy
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:3001/api/integrations/google/callback
      GITHUB_APP_ID: "1"
      GITHUB_APP_SLUG: ci-dummy
      GITHUB_APP_CLIENT_ID: ci-dummy
      GITHUB_APP_CLIENT_SECRET: ci-dummy
      GITHUB_APP_PRIVATE_KEY: ci-dummy
      GITHUB_WEBHOOK_SECRET: ci-dummy
      GITHUB_APP_REDIRECT_URI: http://localhost:3001/api/integrations/github/callback
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: corepack pnpm --filter @alfred/db db:migrate

      - name: HTTP tests
        run: corepack pnpm --filter @alfred/http test

  http-env-free-load:
    name: http-env-free-load
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: HTTP barrel loads with no service environment
        run: corepack pnpm --filter @alfred/http test:env-free

  # `@alfred/db` owns the one door to an ioredis client, and what a connection
  # does during a Redis outage is decided entirely by that module's
  # `RedisConnectionKind` table. The suite is the only thing that can tell a
  # bounded rejection from a command that never settles, which is what the
  # unbounded offline queue used to produce. It was in no CI job before this one.
  #
  # BOTH services are required now. Redis was always required. Postgres arrived
  # with two suites that moved out of `packages/api/test/`:
  # `test/contracts/user-model-rails.test.ts` and
  # `test/chat/thread-turn-concurrency.test.ts` write real rows, so this job
  # runs a Postgres service and `db:migrate` exactly like `http-tests`. Do not
  # read the `DATABASE_URL` in the `env:` block as a dummy any more: it points at
  # the service above and the schema is migrated before the suite starts. Both
  # suites guard themselves with `dbBackedSkip()` from
  # `packages/db/test/support/db-backed.ts`, which asks about the PRESENCE of a
  # variable and not about reachability — so an absent service block does not
  # skip them, it reddens them on a refused connection. Several subtests point
  # `REDIS_URL` at an endpoint they build
  # themselves; the service is what `redis-cold-command.test.ts` and
  # `redis-subscriber-reconnect.test.ts` need, and both FAIL rather than skip
  # when nothing answers. A skip would silently delete the only proof that
  # `"command"` and `"fail-fast"` differ, and the only proof that a subscriber
  # survives a reconnect. Their liveness probes run on bounded kinds for the
  # same reason: a probe on `"queue"` would hang instead of reporting.
  #
  # This is a separate job rather than a step on `assistant-unit-tests` (which
  # already has a Redis service) so a red row names the package that broke. It
  # pays a second `pnpm install`; see the note at `web-unit-tests` for when that
  # trade goes the other way.
  db-tests:
    name: db-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: alfred_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d alfred_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
      # DATABASE_URL points at the postgres service above and the three
      # DB-backed suites reach it. Every other value here is a format-valid
      # dummy that serverEnv() requires and nothing reads.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/alfred_ci
      BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-32chars-min
      OAUTH_CREDENTIAL_KEK: Y2ktZHVtbXkta2VrLTMyLWJ5dGVzLW5vdC1zZWNyZXQ
      BETTER_AUTH_URL: http://localhost:3001
      ALFRED_ALLOWED_EMAIL: ci@example.com
      RESEND_API_KEY: re_ci_dummy
      RESEND_FROM_EMAIL: Alfred <noreply@example.com>
      ANTHROPIC_API_KEY: ci-dummy
      GOOGLE_GENERATIVE_AI_API_KEY: ci-dummy
      GOOGLE_OAUTH_CLIENT_ID: ci-dummy
      GOOGLE_OAUTH_CLIENT_SECRET: ci-dummy
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:3001/api/integrations/google/callback
      GITHUB_APP_ID: "1"
      GITHUB_APP_SLUG: ci-dummy
      GITHUB_APP_CLIENT_ID: ci-dummy
      GITHUB_APP_CLIENT_SECRET: ci-dummy
      GITHUB_APP_PRIVATE_KEY: ci-dummy
      GITHUB_WEBHOOK_SECRET: ci-dummy
      GITHUB_APP_REDIRECT_URI: http://localhost:3001/api/integrations/github/callback
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: corepack pnpm --filter @alfred/db db:migrate

      - name: DB tests
        run: corepack pnpm --filter @alfred/db test

  # `@alfred/contracts` is the workspace leaf: it declares `zod` as its only
  # runtime dependency, and it depends on no package that depends on it. (It does
  # carry `@alfred/config` in `devDependencies` — a build-config package that
  # names no workspace dependency of its own, so it closes no loop.) Its 19 test
  # files came from `packages/api/test/`: 16 from `test/contracts/`, 2 from
  # `test/briefing/` and 1 from the tree root. They touch NO service, so this job
  # carries no `services:` block and no `env:` block, exactly like
  # `ai-unit-tests` and `logging-unit-tests`. A suite here that needs Postgres or
  # Redis is in the wrong tree: a file that names `@alfred/db` belongs in
  # `packages/db/test`, because the reverse workspace edge would be a cycle.
  #
  # The first step exists because `tsx --test` over a glob that matches NO file
  # prints `# tests 0` and EXITS 0. Measured, not assumed. So a mistyped
  # directory would leave this job green while running nothing at all. The step
  # counts FILES before the runner starts — never a TAP number, which is the
  # guard shape this repo already rejects. The floor is `-gt 0` rather than the
  # current 19 files, because a hard-coded count rots on the next added file. The
  # repo-wide replacement for all nine test jobs is campaign item 205, which
  # deletes this step. The pathspec is a DIRECTORY and the suffix match is a
  # `grep`, because a git pathspec `**` does not match zero directories: the
  # glob `packages/contracts/test/**/*.test.ts` counts 0 over this FLAT tree and
  # the guard would pass on a lie in the one direction it exists to catch.
  contracts-unit-tests:
    name: contracts-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Assert the contracts suite is non-empty
        run: |
          count=$(git ls-files -- 'packages/contracts/test' | grep -c '\.test\.ts$' || true)
          echo "contracts test files: $count"
          test "$count" -gt 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Contracts unit tests
        run: corepack pnpm --filter @alfred/contracts test

  ai-unit-tests:
    name: ai-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: AI unit tests
        run: corepack pnpm --filter @alfred/ai test

  logging-unit-tests:
    name: logging-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Logging unit tests
        run: corepack pnpm --filter @alfred/logging test

  # The two jobs below run the suites that used to hide under `api-tests` because
  # `packages/api/test/` was the only test tree those packages had. Each suite now
  # lives in the package it covers, so it needs a job.
  #
  # They are grouped by the SETUP a suite needs, not one job per package. One job
  # per package is SIX jobs for these six packages: it repeats the 20-line setup
  # preamble six times instead of twice and the 48-line services-and-env block
  # twice instead of once, which is over 100 extra lines of duplicated YAML for
  # the same 31 test files (auth 6, artifacts-design 1, sync 1, extraction 2,
  # corpus 2, integrations 19). Attribution is kept by one NAMED step per package,
  # so a red row names the package that broke. The cost admitted: steps run in
  # sequence, so a red step hides every step after it in the same job. That cost
  # is real, not small — `packages/integrations/test` holds 19 of the 30 files and
  # runs as the SECOND step of `leaf-db-tests`, so a red `Corpus tests` step hides
  # all 19. A package that grows a real suite gets promoted to its own job.
  #
  # Recount before you edit those numbers, and count the same way the steps do:
  #
  #   for p in auth artifacts-design sync extraction corpus integrations; do
  #     git ls-files "packages/$p/test" | grep -c '\.test\.ts$'
  #   done
  #
  # The `auth 2` this line used to claim had been wrong since the package grew to
  # six files, which is the whole argument for keeping the recipe beside the
  # number.
  #
  # Every package step counts its own test files before it runs them, because
  # `tsx --test` over a glob that matches NO file prints `# tests 0` and exits 0.
  # Without that count a package whose `test/` directory is renamed or emptied
  # reports green and runs nothing, which is the exact failure these jobs exist to
  # end. The repo-wide version of that gate is campaign item 205; this is the
  # job-local one.
  #
  # The count lives INSIDE the package's own step, not in one shared loop at the
  # top of the job. A shared loop is a second hand-kept copy of "which packages
  # this job runs": add a leaf package to the run steps, forget the loop, and that
  # package's step matches zero files, prints `# tests 0` and goes green — the
  # guard pre-disarmed for the one package that needed it. The six copies of the
  # count below are deliberate duplication, because a copy that ships with the run
  # command it guards cannot fall out of step with it.
  #
  # Each count uses a DIRECTORY pathspec plus a suffix match, never
  # `test/**/*.test.ts`: a git pathspec `**` does not match zero directories, so
  # the glob spelling counts 0 over a flat test tree and would fail on a lie.
  leaf-unit-tests:
    name: leaf-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Auth unit tests
        run: |
          count=$(git ls-files "packages/auth/test" | grep -c '\.test\.ts$' || true)
          echo "packages/auth/test holds $count *.test.ts files"
          if [ "$count" -eq 0 ]; then
            echo "::error::packages/auth/test matches no *.test.ts file; the run below would exit 0 and test nothing"
            exit 1
          fi
          corepack pnpm --filter @alfred/auth test

      - name: Artifacts-design unit tests
        run: |
          count=$(git ls-files "packages/artifacts-design/test" | grep -c '\.test\.ts$' || true)
          echo "packages/artifacts-design/test holds $count *.test.ts files"
          if [ "$count" -eq 0 ]; then
            echo "::error::packages/artifacts-design/test matches no *.test.ts file; the run below would exit 0 and test nothing"
            exit 1
          fi
          corepack pnpm --filter @alfred/artifacts-design test

      - name: Sync unit tests
        run: |
          count=$(git ls-files "packages/sync/test" | grep -c '\.test\.ts$' || true)
          echo "packages/sync/test holds $count *.test.ts files"
          if [ "$count" -eq 0 ]; then
            echo "::error::packages/sync/test matches no *.test.ts file; the run below would exit 0 and test nothing"
            exit 1
          fi
          corepack pnpm --filter @alfred/sync test

      # Reads the real NAPI binary (linux-x64-gnu on this runner), no Postgres,
      # so the suite belongs here rather than in `leaf-db-tests`.
      - name: Extraction unit tests
        run: |
          count=$(git ls-files "packages/extraction/test" | grep -c '\.test\.ts$' || true)
          echo "packages/extraction/test holds $count *.test.ts files"
          if [ "$count" -eq 0 ]; then
            echo "::error::packages/extraction/test matches no *.test.ts file; the run below would exit 0 and test nothing"
            exit 1
          fi
          corepack pnpm --filter @alfred/extraction test

  # Postgres AND Redis, both as services, plus the full format-valid `serverEnv`
  # block and `db:migrate` — the `http-tests` template. Every DB-backed suite here
  # asks `dbBackedSkip` for `"database"` only, but these files ran under the
  # `api-tests` job until this change, and that job gave them a live Redis. The
  # service stays so that no suite's environment gets WEAKER by moving.
  # (`api-tests` and `packages/api` are both deleted now; campaign item 12
  # removed the job when the last suite left the package.)
  #
  # `dbBackedSkip` throws at module scope when `CI` is set and a required variable
  # is absent, so a broken `env:` block here reddens the job instead of skipping
  # quietly. Do not guard this job by reading a skip count: node:test prints
  # `# skipped 0` for a suite-level skip.
  leaf-db-tests:
    name: leaf-db-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: alfred_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d alfred_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/alfred_ci
      # Format-valid dummies required by serverEnv(). The suites use the local
      # Postgres/Redis services and do not call external providers.
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-32chars-min
      # #453: serverEnv() requires a credential KEK decoding to 32 bytes. This
      # one seals nothing real — CI writes no provider tokens.
      OAUTH_CREDENTIAL_KEK: Y2ktZHVtbXkta2VrLTMyLWJ5dGVzLW5vdC1zZWNyZXQ
      BETTER_AUTH_URL: http://localhost:3001
      ALFRED_ALLOWED_EMAIL: ci@example.com
      RESEND_API_KEY: re_ci_dummy
      RESEND_FROM_EMAIL: Alfred <noreply@example.com>
      ANTHROPIC_API_KEY: ci-dummy
      GOOGLE_GENERATIVE_AI_API_KEY: ci-dummy
      GOOGLE_OAUTH_CLIENT_ID: ci-dummy
      GOOGLE_OAUTH_CLIENT_SECRET: ci-dummy
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:3001/api/integrations/google/callback
      GITHUB_APP_ID: "1"
      GITHUB_APP_SLUG: ci-dummy
      GITHUB_APP_CLIENT_ID: ci-dummy
      GITHUB_APP_CLIENT_SECRET: ci-dummy
      GITHUB_APP_PRIVATE_KEY: ci-dummy
      GITHUB_WEBHOOK_SECRET: ci-dummy
      GITHUB_APP_REDIRECT_URI: http://localhost:3001/api/integrations/github/callback
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: corepack pnpm --filter @alfred/db db:migrate

      - name: Corpus tests
        run: |
          count=$(git ls-files "packages/corpus/test" | grep -c '\.test\.ts$' || true)
          echo "packages/corpus/test holds $count *.test.ts files"
          if [ "$count" -eq 0 ]; then
            echo "::error::packages/corpus/test matches no *.test.ts file; the run below would exit 0 and test nothing"
            exit 1
          fi
          corepack pnpm --filter @alfred/corpus test

      - name: Integrations tests
        run: |
          count=$(git ls-files "packages/integrations/test" | grep -c '\.test\.ts$' || true)
          echo "packages/integrations/test holds $count *.test.ts files"
          if [ "$count" -eq 0 ]; then
            echo "::error::packages/integrations/test matches no *.test.ts file; the run below would exit 0 and test nothing"
            exit 1
          fi
          corepack pnpm --filter @alfred/integrations test

  # @alfred/assistant holds product modules moved out of @alfred/api during
  # Phase 6B. Some are DB-backed (e.g. `delivery` owns notification idempotency
  # over `email_sends`), so this job runs Postgres + Redis + a format-valid
  # serverEnv, exactly like `http-tests`. The check name stays `assistant-unit-tests`
  # (branch-protection stability); the `test` glob runs both pure and DB-backed
  # suites, picking up the DB from the job-level env just as `http-tests` does.
  # `timeout-minutes` is 20 rather than 10 because campaign item 187 moved 114
  # runnable suites here from `api-tests` (100 -> 214), so the job takes about
  # twice as long as before. A timeout is the one way this job reports red for a
  # reason no assertion caused.
  assistant-unit-tests:
    name: assistant-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: alfred_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d alfred_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/alfred_ci
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-dummy-better-auth-secret-32chars-min
      OAUTH_CREDENTIAL_KEK: Y2ktZHVtbXkta2VrLTMyLWJ5dGVzLW5vdC1zZWNyZXQ
      BETTER_AUTH_URL: http://localhost:3001
      ALFRED_ALLOWED_EMAIL: ci@example.com
      RESEND_API_KEY: re_ci_dummy
      RESEND_FROM_EMAIL: Alfred <noreply@example.com>
      ANTHROPIC_API_KEY: ci-dummy
      GOOGLE_GENERATIVE_AI_API_KEY: ci-dummy
      GOOGLE_OAUTH_CLIENT_ID: ci-dummy
      GOOGLE_OAUTH_CLIENT_SECRET: ci-dummy
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:3001/api/integrations/google/callback
      GITHUB_APP_ID: "1"
      GITHUB_APP_SLUG: ci-dummy
      GITHUB_APP_CLIENT_ID: ci-dummy
      GITHUB_APP_CLIENT_SECRET: ci-dummy
      GITHUB_APP_PRIVATE_KEY: ci-dummy
      GITHUB_WEBHOOK_SECRET: ci-dummy
      GITHUB_APP_REDIRECT_URI: http://localhost:3001/api/integrations/github/callback
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: corepack pnpm --filter @alfred/db db:migrate

      - name: Assistant tests
        run: corepack pnpm --filter @alfred/assistant test

  # This job builds the browser bundle as well as running the web unit tests. The
  # name is unchanged and this comment carries the widened remit instead, because
  # a second job would pay a second full `pnpm install` for the same signal. Until
  # the build step below, no job in this workflow invoked vite, so a change that
  # type-checked and passed every unit test could still break `vite build`, and
  # the first place that showed up was a deploy. The build also writes
  # `apps/web/src/routeTree.gen.ts` and reaches into the route sources under
  # `apps/web/src/routes/`, which is why the assertion after it is worth its
  # lines. The two write sets are not the same kind of file: the route tree is
  # generated and the router plugin is its only writer, while the route sources
  # are hand-authored components in which the plugin owns only the
  # `createFileRoute` id argument. `@tanstack/router-plugin` is a floating caret
  # (`^1.121.7` in `pnpm-workspace.yaml`), so a plugin bump can change what it
  # emits. `vite build` needs no `env:` and no `services:` — `apps/web` has no
  # `.env*` file. The last step runs a SECOND vite pass, for a different question:
  # the build says the bundle compiles, and `pnpm check:web-bundle-graph` says what
  # is in it. That check is a step here rather than a job of its own for the same
  # reason as the build, and it is deliberately outside the local `pnpm check` chain
  # because it costs 10-35 s depending on how warm the vite cache is.
  web-unit-tests:
    name: web-unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE_PATH=$(corepack pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # The router plugin swallows a generator failure into `console.error` and
      # lets the build exit 0, and it throws before it writes the tree. A build
      # whose generator never ran therefore leaves the committed file
      # byte-unchanged, which is indistinguishable from agreement. Deleting the
      # file first closes that hole at the build step below, not at the assertion:
      # `apps/web/src/main.tsx` imports `./routeTree.gen` statically, so a
      # generator that emits nothing makes `Web build` fail on an unresolvable
      # import, and the job stops there with the assertion never running.
      - name: Delete the generated route tree so the build must re-emit it
        run: rm apps/web/src/routeTree.gen.ts

      - name: Web build
        run: corepack pnpm --filter web build

      # `git status --porcelain`, not `git diff --exit-code`: the invariant is that
      # a build leaves the tree clean, and `git diff` is tracked-only, so it is
      # blind to a path the generator adds. Porcelain exits 0 whether or not it
      # prints, so the test is on its output.
      - name: Committed sources match the route generator
        run: |
          CHANGED="$(git status --porcelain)"
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED"
            git diff
            echo "::error::The web build changed the tree, so what is committed is not what @tanstack/router-plugin emits. The changed paths are listed above. If apps/web/src/routeTree.gen.ts changed, run 'pnpm --filter web build' and commit that file verbatim - it is generated and the plugin is its only writer. If a file under apps/web/src/routes/ changed, the plugin rewrote its createFileRoute id to match where the file sits: do NOT commit that rewrite, it discards your own edit - rename the file or change the id so the two agree."
            exit 1
          fi

      # A second vite pass, and it asks a question the first one cannot. `pnpm --filter
      # web build` proves the bundle BUILDS; this proves what is IN it. The gap is real:
      # a Node-only npm package that resolves — `pg` declared by a browser-safe
      # workspace, several hops down a subpath condition — bundles cleanly and fails
      # only in a browser at runtime, and neither the build nor the source fence in
      # `scripts/web-boundaries.mjs` can see it. It runs AFTER the assertion above so a
      # second vite pass can never be the thing that makes that assertion fail.
      - name: Node-only packages are out of the browser bundle
        run: corepack pnpm check:web-bundle-graph

      - name: Web unit tests
        run: corepack pnpm --filter web test
